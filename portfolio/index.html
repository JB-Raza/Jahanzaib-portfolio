    <!-- ── Fonts ─────────────────────────────────────────────────────────── -->
    <!--
      Strategy: preconnect + async stylesheet load.
      The `media="print"` trick makes the browser fetch the CSS without
      blocking rendering; `onload` then switches it to `all` so it applies.
      This alone can improve FCP by 300–600 ms (no more render-blocking font).
      The <noscript> fallback keeps fonts working without JavaScript.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
